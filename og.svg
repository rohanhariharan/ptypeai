<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="ptype — a local-first AI that ships your projects">
  <defs>
    <style>
      .h { font-family: "Cormorant", Georgia, "Times New Roman", serif; font-weight: 300; fill: #000; }
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill: #4a4a4a; }
      .u { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill: #8b8b86; letter-spacing: 0.14em; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#f7f5ef" />

  <!-- the mark: the same 3 x 5 pixel P as the favicon, 8px cells with 5px gaps -->
  <g fill="#000">
    <rect x="96" y="64" width="8" height="8"/>
    <rect x="109" y="64" width="8" height="8"/>
    <rect x="122" y="64" width="8" height="8"/>
    <rect x="96" y="77" width="8" height="8"/>
    <rect x="122" y="77" width="8" height="8"/>
    <rect x="96" y="90" width="8" height="8"/>
    <rect x="109" y="90" width="8" height="8"/>
    <rect x="122" y="90" width="8" height="8"/>
    <rect x="96" y="103" width="8" height="8"/>
    <rect x="96" y="116" width="8" height="8"/>
  </g>
  <text class="h" x="146" y="112" font-size="54">ptype</text>

  <text class="h" x="94" y="306" font-size="78">A local-first AI that</text>
  <text class="h" x="94" y="392" font-size="78">ships your projects.</text>

  <text class="t" x="96" y="472" font-size="29">Say it — ptype files it, then runs a real agent that writes</text>
  <text class="t" x="96" y="510" font-size="29">the files, tests them, and commits. On your machine.</text>

  <text class="u" x="96" y="584" font-size="22">PTYPE.APP</text>
</svg>
